<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Receba um código no e-mail da sua conta para definir uma nova senha.">
  <title>Recuperar senha | Anjos de Patas</title>
  <link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="../css/internal.css">
<link rel="stylesheet" href="../css/adotante-acesso.css">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="../css/design-system.css">
<link rel="stylesheet" href="../css/adotante-acesso.css">
    <link rel="icon" type="image/png" href="../assets/images/logo_anjos_de_patas.png?v=20261028">
</head>
<body>
  <main class="pagina-login">
    <section class="login-apresentacao" aria-label="Anjos de Patas"><img src="../assets/images/adotante-acesso.jpg" alt="Cachorro golden retriever ao ar livre" decoding="async"><h2>Um novo começo.</h2><p>Proteção animal e adoção responsável.</p></section>
<section class="login" aria-labelledby="titulo-conta">
      <a href="../index.html" class="identidade" aria-label="Anjos de Patas — Voltar para a página inicial">
        <img height="60" width="120" src="../assets/images/logo_anjos_de_patas.png" alt="" class="logo">
        <span>Anjos de Patas</span>
      </a>
      <div class="cartao-login">
        <header class="cabecalho-login"><span class="rotulo">Recuperação de acesso</span><h1 id="titulo-conta">Recupere sua senha</h1></header>
        <form id="form-recuperar" class="formulario-login"><div class="campo"><label for="email-recuperar">E-mail da conta</label><input id="email-recuperar" name="email" type="email" autocomplete="email" maxlength="254" required></div><button type="submit" class="botao-login">Enviar código</button></form><form id="form-redefinir" class="formulario-login" hidden><p>Digite o código recebido por e-mail e escolha sua nova senha.</p><div class="campo"><label for="email-redefinir">E-mail da conta</label><input id="email-redefinir" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="campo"><label for="codigo-redefinir">Código de recuperação</label><input id="codigo-redefinir" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required></div><div class="campo"><label for="senha-redefinir">Nova senha</label><input id="senha-redefinir" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><div class="campo"><label for="confirmar-redefinir">Confirme a nova senha</label><input id="confirmar-redefinir" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><button type="submit" class="botao-login">Salvar nova senha</button><button id="novo-codigo" type="button" class="conta-mostrar-senha">Solicitar outro código</button></form>
        <p id="estado-conta" class="mensagem-login" role="status" aria-live="polite" hidden></p>
        <p class="conta-alternativa"><a href="entrar-adotante.html">Entrar como adotante</a> &middot; <a href="login.html">Entrar na área administrativa</a></p>
        <a href="../index.html" class="voltar">← Voltar para o site</a>
      </div>
    </section>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/recuperar-senha.js"></script>
</body>
</html>
