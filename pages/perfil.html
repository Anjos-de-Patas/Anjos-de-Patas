<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Perfil do usuário do sistema Anjos de Patas."
    >

    <title>Meu perfil | Anjos de Patas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/perfil.css"
    >
</head>

<body>

    <main class="pagina-perfil">

        <section
            class="perfil"
            aria-labelledby="titulo-perfil"
        >

            <header class="topo-perfil">

                <a
                    href="dashboard.html"
                    class="voltar-dashboard"
                >
                    <span aria-hidden="true">←</span>
                    Voltar ao Dashboard
                </a>

            </header>

            <div class="cartao-perfil">

                <div class="cabecalho-perfil">

                    <div
                        id="perfil-avatar"
                        class="perfil-avatar"
                        aria-hidden="true"
                    >
                        U
                    </div>

                    <div>

                        <h1 id="titulo-perfil">
                            Meu perfil
                        </h1>

                        <p>
                            Consulte os dados da sua conta e altere seu nome.
                        </p>

                    </div>

                </div>

                <form
                    id="formulario-perfil"
                    class="formulario-perfil"
                    novalidate
                >

                    <div class="campo">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                            minlength="2"
                            maxlength="100"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            readonly
                            aria-readonly="true"
                        >

                    </div>

                    <div class="campo">

                        <label for="perfil">
                            Função
                        </label>

                        <input
                            type="text"
                            id="perfil"
                            name="perfil"
                            readonly
                            aria-readonly="true"
                        >

                    </div>

                    <div
                        id="mensagem-perfil"
                        class="mensagem-perfil"
                        role="alert"
                        aria-live="assertive"
                        hidden
                    ></div>

                    <div class="acoes">

                        <a
                            href="dashboard.html"
                            class="botao-secundario"
                        >
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            id="botao-salvar"
                            class="botao-principal"
                        >
                            Salvar alterações
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <div
        id="modal-sucesso"
        class="modal"
        hidden
    >

        <div
            class="modal-fundo"
            aria-hidden="true"
        ></div>

        <div
            class="modal-conteudo"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-titulo"
            aria-describedby="modal-texto"
        >

            <div
                class="modal-icone"
                aria-hidden="true"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M20 6 9 17l-5-5"></path>
                </svg>
            </div>

            <h2 id="modal-titulo">
                Perfil atualizado
            </h2>

            <p id="modal-texto">
                Suas informações foram atualizadas com sucesso.
            </p>

            <button
                type="button"
                id="botao-confirmar"
                class="botao-confirmar"
            >
                OK
            </button>

        </div>

    </div>

    <script src="../js/perfil.js"></script>

</body>

</html>
